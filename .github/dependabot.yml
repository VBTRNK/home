# Version updates wait 5 days after a release, so a compromised version is
# usually pulled before it reaches a PR. Security updates are exempt from the
# cooldown. Packages installed by hand are reviewed in their PR's diff.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 5
    commit-message:
      prefix: ci

  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 5
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
    ignore:
      # @astrojs/check 0.9.10 accepts only typescript ^5 || ^6 as a peer, so a
      # TypeScript 7 bump fails `npm ci` and the Vercel build (#8). Drop this
      # once a release of @astrojs/check accepts the next major.
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
    commit-message:
      prefix: chore
